# ============================================================
# NexPOS Enterprise API - Render.com Blueprint (render.yaml)
# One-click deploy file - Drop this in GitHub root
# ============================================================

services:
  # ---------------- NexPOS Backend API ----------------
  - type: web
    name: nexpos-api
    runtime: docker
    repo: https://github.com/your-github-username/Pos_SD5  # ⚠️ REPLACE WITH YOUR ACTUAL REPO URL
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    region: singapore  # ⚠️ Change: oregon / singapore / frankfurt (Bangladesh = singapore)
    numInstances: 1
    healthCheckPath: /
    autoDeploy: yes
    pullRequestPreviewsEnabled: no

    # ------------- Environment Variables -------------
    # 🔒 Set these in Render Dashboard "Environment" tab (DO NOT commit real secrets!)
    envVars:

      # 1️⃣ MONGODB
      # Get this from MongoDB Atlas: https://cloud.mongodb.com/
      # Format: mongodb+srv://<username>:<password>@<cluster-url>/
      - key: MongoDbSettings__ConnectionString
        sync: false
        value: mongodb+srv://gmrenco4_db_user:G02m6FsVR8njgNgY@cluster0.tz5au5t.mongodb.net/

      - key: MongoDbSettings__DatabaseName
        value: POS_SD5_Production

      # Extra fallback env vars (for extra safety)
      - key: MONGODB_CONNECTION_STRING
        sync: false
        value: mongodb+srv://gmrenco4_db_user:G02m6FsVR8njgNgY@cluster0.tz5au5t.mongodb.net/

      - key: MONGODB_DATABASE_NAME
        value: POS_SD5_Production

      # 2️⃣ JWT SECURITY - 🔐 USE A VERY LONG RANDOM STRING (32+ chars!)
      - key: JwtSettings__SecretKey
        generateValue: true
        sync: false

      - key: JwtSettings__Issuer
        value: NexPosAPI

      - key: JwtSettings__Audience
        value: NexPosClient

      - key: JwtSettings__ExpiryMinutes
        value: 1440

      # 3️⃣ ASP.NET CORE
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: true

      # 4️⃣ LOGGING
      - key: Logging__LogLevel__Default
        value: Information

      - key: Logging__LogLevel__Microsoft
        value: Warning

      - key: Logging__LogLevel__Microsoft.AspNetCore
        value: Warning
